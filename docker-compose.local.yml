# Local development overrides on top of docker-compose.yml:
#   - app containers run the development image with the source tree bind-mounted
#   - infrastructure ports are published on localhost
#
#   bun run docker:local:up   # docker compose -f docker-compose.yml -f docker-compose.local.yml up

x-onlydoge-dev-build: &onlydoge-dev-build
  context: .
  target: development

services:
  postgres:
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  minio:
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'

  clickhouse:
    ports:
      - '${CLICKHOUSE_HTTP_PORT:-8123}:8123'

  dogecoin:
    ports:
      - '${DOGECOIN_RPC_PORT:-22555}:22555'
      - '${DOGECOIN_ZMQ_PORT:-28332}:28332'

  onlydoge-api:
    build: *onlydoge-dev-build
    image: onlydoge/onlydoge:dev
    # Not `bun --watch`: it survives app crashes and leaves the port dead while the
    # container stays "up". Docker restart policy recovers process exits instead.
    command:
      - /bin/sh
      - -lc
      - |
        bun install --frozen-lockfile
        exec bun run apps/onlydoge/src/index.ts --mode=http --ip=0.0.0.0 --port=2277
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - bun_install_cache:/root/.bun/install/cache

  onlydoge-indexer:
    build: *onlydoge-dev-build
    image: onlydoge/onlydoge:dev
    command:
      - /bin/sh
      - -lc
      - |
        bun install --frozen-lockfile
        npm ci --omit=dev --prefix scripts/zmq-rawtx-bridge
        exec bun run apps/onlydoge/src/index.ts --mode=indexer
    volumes:
      - .:/app
      - indexer_node_modules:/app/node_modules
      - bun_install_cache:/root/.bun/install/cache
      - zmq_bridge_node_modules:/app/scripts/zmq-rawtx-bridge/node_modules

volumes:
  api_node_modules:
  indexer_node_modules:
  bun_install_cache:
  zmq_bridge_node_modules:
