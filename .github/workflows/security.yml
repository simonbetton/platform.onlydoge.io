name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22.22.1

jobs:
  zmq-bridge-audit:
    name: ZMQ Bridge Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/zmq-rawtx-bridge/package-lock.json

      - name: Install locked bridge dependencies
        run: npm ci --omit=dev --prefix scripts/zmq-rawtx-bridge

      - name: Audit bridge production dependencies
        run: npm audit --omit=dev --audit-level=high --prefix scripts/zmq-rawtx-bridge

      - name: Smoke-check bridge module
        run: |
          node --check scripts/zmq-rawtx-bridge/index.mjs
          node -e "require('./scripts/zmq-rawtx-bridge/node_modules/zeromq')"

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun audits the complete workspace lockfile and cannot omit dev dependencies.
      # The ignored Vite advisories are confined to vitest > @vitest/mocker > vite;
      # additions or removals require a reviewed change to audit:production.
      - name: Reject high or critical production advisories
        run: bun run audit:production

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          vulnerability-check: true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-vulnerability-scan:
    name: Image Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image for scanning
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          load: true
          push: false
          tags: onlydoge-security:${{ github.sha }}
          target: production

      - name: Scan production image gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: table
          ignore-unfixed: true
          image-ref: onlydoge-security:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'
        env:
          TRIVY_DISABLE_VEX_NOTICE: true

      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: sarif
          ignore-unfixed: true
          image-ref: onlydoge-security:${{ github.sha }}
          limit-severities-for-sarif: true
          output: trivy-image.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '0'
        env:
          TRIVY_DISABLE_VEX_NOTICE: true

      - name: Upload Trivy SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
